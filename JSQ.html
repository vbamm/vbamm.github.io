body{max-width:960px;margin:22px auto;padding:0 16px;background:#ffffff;}
h1{font-size:20px;margin-bottom:16px;font-weight:600;}

.mode-wrap{

  </div>
  <div class="mode-card" data-mode="mode2" onclick="switchModeByCard('mode2')">

  </div>
  <div class="mode-card" data-mode="mode3" onclick="switchModeByCard('mode3')">
    <div class="title">模式 3</div>

  </div>
  <div class="row">
    <label>目标下垂 H(mm)：</label>

</div>

<div id="panelMode2" class="panel hide">
  <div class="row">
    <label>选定颗数 T：</label>
    <input id="inpTfixed" type="number" placeholder="取值15到87">
  </div>
  <div class="row">
    <label>跨度 W(mm)：</label>
    <input id="inpW2" type="number" placeholder="最小380">
  </div>
</div>

<div id="panelMode3" class="panel hide">

    <label>目标长度 L(mm)：</label>
    <input id="inpSingleL" type="number" placeholder="例1978">
  </div>
</div>

<div class="row">
  <button onclick="calc()">开始计算</button>
</div>

<div class="result" id="out"></div>

<div id="recordBlock" class="record-block">
  <div id="recordList"></div>
  <div class="wrap-right">
    <button class="btn-clear-all" onclick="clearAllRecord()">全部清除</button>

function renderRecord(){
  const dom = document.getElementById("recordList");
  let html = "";
  for(let i=0;i<MAX_RECORD;i++){
    const d = recordArr[i];
    if(d===null){
      html += `<div class="record-item">
        <span class="record-empty">记录${i+1}：（空）</span>
        <button class="btn-clear-item" onclick="clearOneRecord(${i})">清除</button>
      </div>`;
    }else{
      html += `<div class="record-item">
        <span>记录${i+1}：T=${d.T}｜L=${d.L}｜W=${d.W}｜H=${d.H}</span>
        <button class="btn-clear-item" onclick="clearOneRecord(${i})">清除</button>
      </div>`;
    }
  }
  dom.innerHTML = html;
}

function getFirstEmptyRecordIndex(){
  for(let i=0;i<MAX_RECORD;i++){
    if(recordArr[i]===null) return i;
  }
  return -1;
}

function pushRecord(obj){
  const idx = getFirstEmptyRecordIndex();
  if(idx === -1){
    alert("记录已满（最多5条），请先清除部分记录");
    return;
  }
  recordArr[idx] = {...obj};
  renderRecord();
}

function clearOneRecord(index){
  recordArr[index] = null;
  renderRecord();
}

function clearAllRecord(){
  recordArr = Array(MAX_RECORD).fill(null);
  renderRecord();
}

function switchModeByCard(modeVal){
  document.querySelectorAll('.mode-card').forEach(card=>{
    if(card.dataset.mode === modeVal){
      card.classList.add('active');
    }else{
      card.classList.remove('active');
    }
  })
  document.getElementById("panelMode1").classList.add("hide");
  document.getElementById("panelMode2").classList.add("hide");
  document.getElementById("panelMode3").classList.add("hide");
  const recordBlock = document.getElementById("recordBlock");
  if(modeVal==="mode1"){
    document.getElementById("panelMode1").classList.remove("hide");
    recordBlock.classList.remove("hide");
  }else if(modeVal==="mode2"){
    document.getElementById("panelMode2").classList.remove("hide");
    recordBlock.classList.remove("hide");
  }else if(modeVal==="mode3"){
    document.getElementById("panelMode3").classList.remove("hide");
    recordBlock.classList.add("hide");
  }
  document.getElementById("out").innerHTML="";
}

function getLbyT(T){
  const arr = [...TLData].sort((a,b)=>a.T-b.T);
  const last = arr[arr.length-1];
  for(let i=0;i<arr.length-1;i++){
    const a=arr[i],b=arr[i+1];
    if(a.T <= T && T <= b.T){
      const ratio=(T-a.T)/(b.T-a.T);
      const L = a.L + ratio*(b.L - a.L);
      return {L:L, source:"sample"};
    }
  }
  if(T>last.T){
    //T大于87，向上外推
    const p1 = arr[arr.length-2];
    const p2 = last;
    const slope=(p2.L-p1.L)/(p2.T-p1.T);
    const L = p2.L + slope*(T-p2.T);
    return {L:L, source:"extrap"};
  }
  if(T<arr[0].T){
    const p1=arr[0];
    const p2=arr[1];
    const slope=(p2.L-p1.L)/(p2.T-p1.T);
    const L = p1.L + slope*(T-p1.T);
    return {L:L, source:"extrap"};
  }
  return {L:null, source:"invalid"};
}

function catenarySolveH(W, L){
  const pi = Math.PI;
  const term1 = (12 * L / pi) - 4 * W;
  let sqrtInner = (4 * W - 12 * L / pi) ** 2 - 24 * (6 * (W/2)**2 - 6 * (2 * L / pi) * (W/2) + (2 * L / pi)**2);
  sqrtInner = Math.max(sqrtInner, 0);
  const term2 = Math.sqrt(sqrtInner);
  const H = (term1 + term2) / 12;
  if(!isFinite(H) || H <= 0){
    return null;
  }
  return H;
}

function lookupSample(T,W){
  const matches = LTwHData.filter(x=>x.T===T && x.W===W);
  if(matches.length===0) return null;
  return matches[0];
}

function getTTagHtml(T){
  if(T>=1 && T<=50){
    return "";
  }else if(T>=51 && T<=63){
    return `<span class="tag-heavy">偏重</span>`;
  }else if(T>=64 && T<=87){
    return `<span class="tag-overload">超重</span>`;
  }else{
    return "";
  }
}

function calc(){
  let mode;
  document.querySelectorAll('.mode-card').forEach(card=>{
    if(card.classList.contains('active')) mode = card.dataset.mode;
  })
  const outDom = document.getElementById("out");
  outDom.innerHTML="";

  if(mode==="mode3"){
    const targetEffectiveL = Number(document.getElementById("inpSingleL").value);
    if(isNaN(targetEffectiveL) || targetEffectiveL <= 0){
      outDom.innerHTML="<div class='warn-y'>请输入有效的目标长度L(mm)</div>";
      return;
    }
    const list=[];
    for(let T=1;T<=87;T++){
      const {L:Lraw,source} = getLbyT(T);
      if(Lraw===null) continue;
      const effectiveL = Lraw - singleOffset;
      list.push({
        T:T,
        effectiveL:Math.round(effectiveL),
        deltaRaw:effectiveL - targetEffectiveL,
        delta:Math.round(Math.abs(effectiveL-targetEffectiveL)),
        source:source
      });
    }
    if(list.length===0){
      outDom.innerHTML="<div class='warn-r'>没有可用T(1‑87)</div>";
      return;
    }
    const below = list.filter(x=>x.effectiveL <= targetEffectiveL);
    const above = list.filter(x=>x.effectiveL > targetEffectiveL);
    let itemBelow=null,itemAbove=null;
    if(below.length>0){
      below.sort((a,b)=>b.effectiveL - a.effectiveL);
      itemBelow = below[0];
    }
    if(above.length>0){
      above.sort((a,b)=>a.effectiveL - a.effectiveL);
      itemAbove = above[0];
    }
    let html="";
    html += `<div class='normal'>单吊模式｜输入目标长度：${targetEffectiveL}mm</div>`;
    html += "<h4>【邻近T二选一】</h4>";

    if((itemBelow && itemBelow.T >=87) && (!itemAbove)){
      html += `<div class="warn-r">不能生产， T=87，最大L7944</div>`;
    }else{
      if(itemBelow){
        let note = itemBelow.deltaRaw < 0 ? "（偏短）" : "（匹配）";
        const tagHtml = getTTagHtml(itemBelow.T);
        html += `<div class="normal">
<span>T=${itemBelow.T}｜单吊有效L=${itemBelow.effectiveL}mm｜偏差${itemBelow.delta}mm${note}</span>
${tagHtml}
</div>`;
      }
      if(itemAbove){
        const tagHtml = getTTagHtml(itemAbove.T);
        html += `<div class="normal">
<span>T=${itemAbove.T}｜单吊有效L=${itemAbove.effectiveL}mm｜偏差${itemAbove.delta}mm（偏长）</span>
${tagHtml}
</div>`;
      }
    }
    outDom.innerHTML = html;
    return;
  }

  if(mode==="mode2"){
    const Tfixed = Number(document.getElementById("inpTfixed").value);
    const W = Number(document.getElementById("inpW2").value);
    if(isNaN(Tfixed)||isNaN(W)){
      outDom.innerHTML="<div class='warn-y'>请输入有效的数字</div>";
      return;
    }
    if(W<380){
      outDom.innerHTML="<div class='warn-r'>错误：跨度W不能小于380mm</div>";
      return;
    }

    const {L:Lreal,source} = getLbyT(Tfixed);
    if(Lreal===null){
      outDom.innerHTML="<div class='warn-r'>该T无法计算绳长L</div>";
      return;
    }
    if(Lreal <= W){
      outDom.innerHTML="<div class='warn-r'>绳长L小于等于跨度W，物理不可安装</div>";
      return;
    }
    const samp = lookupSample(Tfixed,W);
    let Hreal=null;
    if(samp){
      if(samp.note==="不可安装"){
        outDom.innerHTML="<div class='warn-r'>该T、W组合：样本标记不可安装</div>";
        return;
      }
      Hreal = samp.H;
    }
    if(Hreal===null){
      Hreal = catenarySolveH(W, Lreal);
    }
    if(Hreal===null || !isFinite(Hreal)){
      outDom.innerHTML="<div class='warn-r'>无法求解下垂H</div>";
      return;
    }
    const Lround = Math.round(Lreal);
    const Hround = Math.round(Hreal);

    const recObj = {T:Tfixed, L:Lround, W:W, H:Hround};
    let html="";
    html += `<div class='normal'>输入：选定T=${Tfixed}，跨度W=${W}mm</div>`;
    html += `<div class='normal'>
<span>T=${Tfixed}｜总绳长L=${Lround}mm｜计算下垂H=${Hround}mm</span>
<button class="btn-record" onclick='pushRecord(${JSON.stringify(recObj)})'>记录</button>
</div>`;
    // T边界警告
    if(Tfixed>87){
      html += `<div class="warn-y">⚠️最多颗数T=87</div>`;
    }
    if(Tfixed<15){
      html += `<div class="warn-y">⚠️最小颗数T=15</div>`;
    }
    outDom.innerHTML = html;
    return;
  }

  const W = Number(document.getElementById("inpW").value);
  const Htarget = Number(document.getElementById("inpHt").value);
  if(isNaN(W)||isNaN(Htarget)){
    outDom.innerHTML="<div class='warn-y'>请输入有效的数字</div>";
    return;
  }
  if(W<380){
    outDom.innerHTML="<div class='warn-r'>错误：跨度W不能小于380mm</div>";
    return;
  }

  const candidates = [];
  for(let T=15;T<=87;T++){
    const {L:Lreal, source} = getLbyT(T);
    if(Lreal===null) continue;
    if(Lreal <= W) continue;

    const samp = lookupSample(T,W);
    let Hreal=null;
    let note="";
    if(samp){
      note = samp.note;
      Hreal = samp.H;
      if(note==="不可安装") continue;
    }
    if(Hreal===null){
      Hreal = catenarySolveH(W, Lreal);
      if(Hreal === null){
        note = "绳长不足，达不到目标下垂";
      }else{
        note = "数学悬链计算(无实测样本)";
      }
    }
    if(Hreal===null) continue;

    const deltaRaw = Hreal - Htarget;
    const deltaAbs = Math.abs(deltaRaw);
    candidates.push({
      T,
      L:Math.round(Lreal),
      H:Math.round(Hreal),
      W: W,
      deltaRaw:deltaRaw,
      delta:Math.round(deltaAbs),
      source:source,
      note:note
    })
  }
  if(candidates.length===0){
    outDom.innerHTML="<div class='warn-r'>没有找到可行T(15‑87)，请降低目标H或者加大绳长</div>";
    return;
  }

  const sampleList = candidates.filter(c=>c.source==="sample");
  const extrapList = candidates.filter(c=>c.source==="extrap");

  sampleList.sort((a,b)=>a.delta-b.delta);
  extrapList.sort((a,b)=>a.delta-b.delta);
  const fullSorted = [...sampleList, ...extrapList];

  const belowList = fullSorted.filter(c => c.H <= Htarget);
  const aboveList = fullSorted.filter(c => c.H > Htarget);
  let lower=null,upper=null;
  if(belowList.length>0){
    belowList.sort((a,b)=>b.H - a.H);
    lower = belowList[0];
  }
  if(aboveList.length>0){
    aboveList.sort((a,b)=>a.H - b.H);
    upper = aboveList[0];
  }

  let html="";
  html += `<div class='normal'>客户输入：W=${W}mm，目标H=${Htarget}mm；T范围：15‑87</div>`;
  html += "<h4>【邻近整数颗数推荐（二选一）】</h4>";
  if(lower) html += formatItem(lower);
  if(upper) html += formatItem(upper);

  outDom.innerHTML = html;
}

function formatItem(rec){
  let desc;
  if(rec.deltaRaw < 0){
    desc = `偏差${rec.delta}mm（下垂偏短）`;
  }else if(rec.deltaRaw >0){
    desc = `偏差${rec.delta}mm（下垂偏长）`;
  }else{
    desc = `偏差${rec.delta}mm（完全匹配）`;
  }
  return `<div class="normal">
<span>T=${rec.T}｜L=${rec.L}mm｜计算H=${rec.H}mm｜${desc}</span>
<button class="btn-record" onclick='pushRecord(${JSON.stringify({T:rec.T,L:rec.L,W:rec.W,H:rec.H})})'>记录</button>
</div>`;
}

renderRecord();
</script>
</body>
</html>
