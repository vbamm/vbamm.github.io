    <style>
        :root{
            --bg:#f5f7fa;
            --card:#ffffff;
            --text:#222222;
            --subtext:#555555;
            --hover:#e8ecf2;
            --border:#dddddd;
        }
        [data-theme="dark"]{
            --bg:#18191c;
            --card:#242529;
            --text:#eeeeee;
            --subtext:#bbbbbb;
            --hover:#2f3136;
            --border:#3a3c42;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif;transition: background 0.3s, color 0.3s;}
        body{
            background: var(--bg);
            color: var(--text);
            min-height:100vh;
            padding:30px 16px;
        }
        .wrap{
            max-width:920px;
            margin:0 auto;
        }
        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:32px;
        }
        h1{
            font-size:22px;
            font-weight:500;
        }
        #themeBtn{
            padding:8px 14px;
            border-radius:8px;
            border:1px solid var(--border);
            background:var(--card);
            color:var(--text);
            cursor:pointer;
            font-size:14px;
        }
        /* 搜索区域【已修改：去掉阴影，改用细边框】 */
        .search-box{
            background:var(--card);
            border-radius:16px;
            padding:18px;
            border:1px solid var(--border);
            margin-bottom:30px;
        }
        .search-switch{
            display:flex;
            gap:10px;
            margin-bottom:14px;
        }
        .search-switch button{
            padding:6px 16px;
            border-radius:6px;
            border:1px solid var(--border);
            background:transparent;
            color:var(--subtext);
            cursor:pointer;
        }
        .search-switch button.active{
            background:#3377dd;
            color:white;
            border-color:#3377dd;
        }
        .search-input-area{
            display:flex;
        }
        #searchInput{
            flex:1;
            height:46px;
            padding:0 16px;
            border:1px solid var(--border);
            border-radius:10px 0 0 10px;
            background:transparent;
            color:var(--text);
            font-size:16px;
            outline:none;
        }
        #searchBtn{
            height:46px;
            padding:0 22px;
            border:none;
            border-radius:0 10px 10px 0;
            background:#3377dd;
            color:white;
            cursor:pointer;
        }
        /* 分组标题样式 */
        .group-title{
            font-size:18px;
            margin:40px 0 16px;
            padding-bottom:6px;
            border-bottom:2px solid #dd4444;
        }
        /* 图标网格布局 */
        .link-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(85px,1fr));
            gap:16px;
        }
        .item{
            display:flex;
            flex-direction:column;
            align-items:center;
            text-decoration:none;
            padding:12px 6px;
            border-radius:14px;
        }
        .item:hover{
            background:var(--hover);
        }
        .icon-box{
            width:52px;height:52px;
            border-radius:12px;
            background:var(--card);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            margin-bottom:8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .name{
            font-size:13px;
            color:var(--subtext);
            text-align:center;
        }
        /* 超小屏幕3列兼容 */
        @media (max-width:360px){
            .link-grid{
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>

<script>
// 搜索引擎配置
const engines = {
    bing: "https://cn.bing.com/search?q=",
    toutiao: "https://so.toutiao.com/search?keyword=",
    quark: "https://quark.sm.cn/s?q=",
    doubao: "https://www.doubao.com/chat"
};
let currentEngine = "bing";

const switchBtns = document.querySelectorAll('.search-switch button');
const input = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');

// 切换搜索引擎按钮
switchBtns.forEach(btn=>{
    btn.onclick = ()=>{
        switchBtns.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentEngine = btn.dataset.engine;
        input.focus();
    }
})

// 执行搜索
async function doSearch(){
    const word = input.value.trim();
    if(!word) return;

    if(currentEngine === "doubao"){
        //豆包：复制文字到剪贴板，打开网页
        try{
            await navigator.clipboard.writeText(word);
        }catch(e){
            console.log("复制失败");
        }
        window.open(engines[currentEngine], '_blank');
    }else{
        //必应/夸克直接搜索
        window.open(engines[currentEngine] + encodeURIComponent(word), '_blank');
    }
}

searchBtn.onclick = doSearch;
input.onkeydown = e=>{
    if(e.key === 'Enter') doSearch();
}

// 明暗主题切换
const themeBtn = document.getElementById('themeBtn');
themeBtn.onclick = ()=>{
    if(document.body.getAttribute('data-theme') === 'dark'){
        document.body.removeAttribute('data-theme');
        localStorage.setItem('theme','light');
    }else{
        document.body.setAttribute('data-theme','dark');
        localStorage.setItem('theme','dark');
    }
}
// 读取上次保存的主题
if(localStorage.getItem('theme') === 'dark'){
    document.body.setAttribute('data-theme','dark');
}
</script>
